<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLmico Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-10">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-graduation-cap"></i> RLmico DB
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="fetchData(true)" class="bg-indigo-500 hover:bg-indigo-700 text-xs px-3 py-2 rounded-lg transition flex items-center gap-1">
                    <i id="iconRefresh" class="fa-solid fa-rotate-right"></i> Refresh
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

        <!-- Status Loading Awal (Hanya jika belum ada cache di HP) -->
        <div id="loading" class="text-center py-10">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600 mb-2"></i>
            <p class="text-slate-500 text-sm">Memuat data terbaru...</p>
        </div>

        <!-- Konten Utama Dashboard -->
        <div id="content" class="hidden space-y-6">

            <!-- Banner Pengumuman -->
            <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg shadow-sm">
                <div class="flex items-start gap-3">
                    <i class="fa-solid fa-bullhorn text-amber-500 text-xl mt-1"></i>
                    <div>
                        <h2 class="font-semibold text-amber-800 text-sm">Pengumuman</h2>
                        <p id="txtPengumuman" class="text-amber-900 text-sm mt-1">Belum ada pengumuman.</p>
                    </div>
                </div>
            </div>

            <!-- Grid Info Kontak & Lokasi -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center gap-3">
                    <div class="bg-emerald-100 text-emerald-600 p-3 rounded-lg">
                        <i class="fa-brands fa-whatsapp text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400 font-medium">WhatsApp Admin</p>
                        <p id="txtWa" class="font-semibold text-slate-700 text-sm">-</p>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center gap-3">
                    <div class="bg-rose-100 text-rose-600 p-3 rounded-lg">
                        <i class="fa-solid fa-location-dot text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400 font-medium">Lokasi</p>
                        <p id="txtLokasi" class="font-semibold text-slate-700 text-sm">-</p>
                    </div>
                </div>
            </div>

            <!-- Daftar Murid -->
            <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-users text-indigo-600"></i> Daftar Murid
                </h2>
                <div id="gridMurid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    <!-- Ditampilkan via JavaScript -->
                </div>
            </section>

            <!-- Galeri Foto -->
            <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-images text-indigo-600"></i> Galeri Kegiatan
                </h2>
                <div id="gridGaleri" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <!-- Ditampilkan via JavaScript -->
                </div>
            </section>

        </div>
    </main>

    <script>
        // Endpoint URL Apps Script Anda
        const API_URL = "https://script.google.com/macros/s/AKfycbyOmBxk1BdtsDQpS9_EDU7tqjAaHLF2gecUQCJoPyXxhSiXFVx5CrwgMLyAA-M5h9o6/exec";

        // Fungsi Utama dengan Caching Instan
        async function fetchData(isManualRefresh = false) {
            const loadingEl = document.getElementById('loading');
            const contentEl = document.getElementById('content');
            const iconRefresh = document.getElementById('iconRefresh');

            if (isManualRefresh) iconRefresh.classList.add('fa-spin');

            // 1. CEK MEMORI HP (INSTANT LOAD < 0.1 detik)
            const localCache = localStorage.getItem('rlmico_dashboard_cache');
            if (localCache) {
                renderDashboard(JSON.parse(localCache));
                loadingEl.classList.add('hidden');
                contentEl.classList.remove('hidden');
            }

            try {
                // 2. FETCH DATA BARU DARI SERVER
                const response = await fetch(API_URL);
                const freshData = await response.json();

                // 3. SIMPAN KE MEMORI HP & UPDATE TAMPILAN
                localStorage.setItem('rlmico_dashboard_cache', JSON.stringify(freshData));
                renderDashboard(freshData);

                loadingEl.classList.add('hidden');
                contentEl.classList.remove('hidden');

            } catch (err) {
                console.error("Gagal memperbarui data:", err);
                if (!localCache) {
                    loadingEl.innerHTML = `
                        <div class="text-rose-500 font-medium py-6">
                            <i class="fa-solid fa-wifi text-2xl mb-2"></i>
                            <p class="text-sm">Gagal memuat data. Periksa koneksi internet Anda.</p>
                            <button onclick="fetchData(true)" class="mt-3 bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-lg">Coba Lagi</button>
                        </div>
                    `;
                }
            } finally {
                if (isManualRefresh) iconRefresh.classList.remove('fa-spin');
            }
        }

        // Render Tampilan Dashboard
        function renderDashboard(data) {
            // Render Pengumuman & Kontak
            document.getElementById('txtPengumuman').innerText = data.pengumuman || "Tidak ada pengumuman saat ini.";
            document.getElementById('txtWa').innerText = data.wa || "Belum diatur";
            document.getElementById('txtLokasi').innerText = data.lokasi || "Belum diatur";

            // Render Murid
            const gridMurid = document.getElementById('gridMurid');
            gridMurid.innerHTML = '';
            if (data.murid && Object.keys(data.murid).length > 0) {
                Object.entries(data.murid).forEach(([id, murid]) => {
                    const card = `
                        <div class="bg-slate-50 border border-slate-200 p-4 rounded-lg shadow-sm">
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-slate-800">${murid.nama || 'Tanpa Nama'}</h3>
                                <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-mono">ID: ${id || '-'}</span>
                            </div>
                            <p class="text-xs text-slate-500 mt-2">
                                <i class="fa-solid fa-star text-amber-400 mr-1"></i> Impian: <span class="font-medium text-slate-700">${murid.impian || '-'}</span>
                            </p>
                            <p class="text-xs text-slate-500 mt-1">
                                <i class="fa-solid fa-tag text-emerald-500 mr-1"></i> Tarif: <span class="font-medium text-slate-700">Rp ${(murid.tarif || 0).toLocaleString('id-ID')}</span>
                            </p>
                        </div>
                    `;
                    gridMurid.innerHTML += card;
                });
            } else {
                gridMurid.innerHTML = `<p class="text-slate-400 text-xs col-span-full text-center py-4">Belum ada data murid.</p>`;
            }

            // Render Galeri
            const gridGaleri = document.getElementById('gridGaleri');
            gridGaleri.innerHTML = '';
            if (data.galeri && data.galeri.length > 0) {
                data.galeri.forEach(item => {
                    const fotoUrl = item.url || item[1] || '';
                    const caption = item.caption || item[2] || '';
                    if (fotoUrl) {
                        const imgCard = `
                            <div class="relative overflow-hidden rounded-lg shadow-sm border border-slate-200 bg-slate-200">
                                <img src="${fotoUrl}" alt="Galeri" class="w-full h-32 object-cover">
                                ${caption ? `<div class="absolute bottom-0 inset-x-0 bg-black/60 text-white text-[10px] p-1.5 truncate">${caption}</div>` : ''}
                            </div>
                        `;
                        gridGaleri.innerHTML += imgCard;
                    }
                });
            } else {
                gridGaleri.innerHTML = `<p class="text-slate-400 text-xs col-span-full text-center py-4">Belum ada foto galeri.</p>`;
            }
        }

        // Jalankan saat pertama kali dibuka
        window.addEventListener('DOMContentLoaded', () => fetchData(false));
    </script>
</body>
</html>
