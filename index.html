<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLmico Dashboard</title>
    <!-- Tailwind CSS untuk styling cepat & bagus -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- Navbar / Header -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid font-bold fa-graduation-cap"></i> RLmico DB
            </h1>
            <button onclick="fetchData()" class="bg-indigo-500 hover:bg-indigo-700 text-sm px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                <i class="fa-solid fa-rotate-right"></i> Refresh
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

        <!-- Status Loading -->
        <div id="loading" class="text-center py-10">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-600 mb-2"></i>
            <p class="text-slate-500">Mengambil data dari Spreadsheet...</p>
        </div>

        <!-- Konten Utama (Disembunyikan saat awal) -->
        <div id="content" class="hidden space-y-6">

            <!-- Banner Pengumuman -->
            <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg shadow-sm">
                <div class="flex items-start gap-3">
                    <i class="fa-solid fa-bullhorn text-amber-500 text-xl mt-1"></i>
                    <div>
                        <h2 class="font-semibold text-amber-800">Pengumuman</h2>
                        <p id="txtPengumuman" class="text-amber-900 text-sm mt-1">Belum ada pengumuman.</p>
                    </div>
                </div>
            </div>

            <!-- Grid Kontak & Informasi -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center gap-3">
                    <div class="bg-emerald-100 text-emerald-600 p-3 rounded-lg">
                        <i class="fa-brands fa-whatsapp text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400 font-medium">WhatsApp Admin</p>
                        <p id="txtWa" class="font-semibold text-slate-700">-</p>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center gap-3">
                    <div class="bg-rose-100 text-rose-600 p-3 rounded-lg">
                        <i class="fa-solid fa-location-dot text-2xl"></i>
                    </div>
                    <div>
                        <p class="text-xs text-slate-400 font-medium">Lokasi</p>
                        <p id="txtLokasi" class="font-semibold text-slate-700">-</p>
                    </div>
                </div>
            </div>

            <!-- Daftar Murid -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-users text-indigo-600"></i> Daftar Murid
                </h2>
                <div id="gridMurid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    <!-- Kartu murid akan otomatis dimasukkan di sini via JavaScript -->
                </div>
            </section>

            <!-- Galeri Foto -->
            <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-images text-indigo-600"></i> Galeri
                </h2>
                <div id="gridGaleri" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <!-- Foto galeri akan dimasukkan di sini -->
                </div>
            </section>

        </div>
    </main>

    <script>
        // URL Web App Apps Script Anda
        const API_URL = "https://script.google.com/macros/s/AKfycbyOmBxk1BdtsDQpS9_EDU7tqjAaHLF2gecUQCJoPyXxhSiXFVx5CrwgMLyAA-M5h9o6/exec";

        async function fetchData() {
            const loadingEl = document.getElementById('loading');
            const contentEl = document.getElementById('content');
            
            loadingEl.classList.remove('hidden');
            contentEl.classList.add('hidden');

            try {
                // Mengambil data dari Apps Script menggunakan GET
                const response = await fetch(API_URL);
                const data = await response.json();

                console.log("Data diterima:", data); // Untuk melihat isi data di Console Browser

                // 1. Tampilkan Pengumuman & Informasi
                document.getElementById('txtPengumuman').innerText = data.pengumuman || "Tidak ada pengumuman saat ini.";
                document.getElementById('txtWa').innerText = data.wa || "Belum diatur";
                document.getElementById('txtLokasi').innerText = data.lokasi || "Belum diatur";

                // 2. Render Daftar Murid
                const gridMurid = document.getElementById('gridMurid');
                gridMurid.innerHTML = ''; // Kosongkan grid sebelum diisi

                if (data.murid && Object.keys(data.murid).length > 0) {
                    Object.entries(data.murid).forEach(([id, murid]) => {
                        const card = `
                            <div class="bg-slate-50 border border-slate-200 p-4 rounded-lg hover:shadow-md transition">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-slate-800 text-lg">${murid.nama || 'Tanpa Nama'}</h3>
                                    <span class="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-mono">ID: ${id || '-'}</span>
                                </div>
                                <p class="text-sm text-slate-500 mt-2">
                                    <i class="fa-solid fa-star text-amber-400 mr-1"></i> 
                                    Impian: <span class="font-medium text-slate-700">${murid.impian || '-'}</span>
                                </p>
                                <p class="text-sm text-slate-500 mt-1">
                                    <i class="fa-solid fa-tag text-emerald-500 mr-1"></i> 
                                    Tarif: <span class="font-medium text-slate-700">Rp ${(murid.tarif || 0).toLocaleString('id-ID')}</span>
                                </p>
                            </div>
                        `;
                        gridMurid.innerHTML += card;
                    });
                } else {
                    gridMurid.innerHTML = `<p class="text-slate-400 col-span-full text-center py-4">Belum ada data murid.</p>`;
                }

                // 3. Render Galeri
                const gridGaleri = document.getElementById('gridGaleri');
                gridGaleri.innerHTML = '';

                if (data.galeri && data.galeri.length > 0) {
                    data.galeri.forEach(item => {
                        // Sesuaikan properti url foto dengan struktur data Anda
                        const fotoUrl = item.url || item[1] || 'https://via.placeholder.com/300';
                        const caption = item.caption || item[2] || '';

                        const imgCard = `
                            <div class="group relative overflow-hidden rounded-lg shadow-sm border border-slate-200">
                                <img src="${fotoUrl}" alt="Galeri" class="w-full h-36 object-cover group-hover:scale-105 transition duration-300">
                                ${caption ? `<div class="absolute bottom-0 inset-x-0 bg-black/60 text-white text-xs p-2 truncate">${caption}</div>` : ''}
                            </div>
                        `;
                        gridGaleri.innerHTML += imgCard;
                    });
                } else {
                    gridGaleri.innerHTML = `<p class="text-slate-400 col-span-full text-center py-4">Belum ada foto galeri.</p>`;
                }

                // Sembunyikan loading, tampilkan konten
                loadingEl.classList.add('hidden');
                contentEl.classList.remove('hidden');

            } catch (err) {
                console.error("Gagal mengambil data:", err);
                loadingEl.innerHTML = `
                    <div class="text-rose-500 font-medium">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-1"></i>
                        <p>Gagal mengambil data dari server Apps Script.</p>
                        <button onclick="fetchData()" class="mt-3 bg-rose-600 text-white text-sm px-4 py-1.5 rounded-lg hover:bg-rose-700">Coba Lagi</button>
                    </div>
                `;
            }
        }

        // Jalankan fungsi fetchData saat halaman pertama kali dibuka
        window.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
